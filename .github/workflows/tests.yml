# .github/workflows/tests.yml
name: nextflow-tests

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    types: [opened, reopened]
    paths-ignore:
      - '**.md'

env:
  NXF_VER: "24.10.9"

jobs:
  utils-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs Nextflow and caches its download + plugins.
      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2

      - name: Run Utils unit tests
        run: |
          nextflow -version
          nextflow run tests/test_utils.nf -lib ./lib -ansi-log false
      
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}  
        uses: actions/setup-python@v4  
        with:  
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies  
        run: |  
          python -m pip install --only-binary=:all: --upgrade pip
          pip install --only-binary=:all: pytest==7.4 synapseclient==4.2
      - name: Run python unit tests
        run: |
          PYTHONPATH=src python -m pytest tests/ -v --tb=short